version: 1
baseUrl: http://127.0.0.1:18085
tests:
  - id: heartbeat
    type: http
    name: 服务就绪
    displayName: 服务就绪
    description: 检查本地服务。
    request:
      method: GET
      url: ${baseUrl}/hello
      timeoutMs: 5000
    expect:
      status: 200
      json:
        status: ok
  - id: ordinary-reply
    type: workflow
    name: 正常回复与历史一致
    displayName: 会话核验 1
    description: 核对本次回答、思考内容和历史记录。
    steps:
      - id: reset
        request:
          method: POST
          url: ${baseUrl}/api/chat/reset
          timeoutMs: 5000
        expect:
          status: 200
          json:
            status: ok
      - id: create
        request:
          method: POST
          url: ${baseUrl}/api/conversations
          json:
            sampleId: R001
          timeoutMs: 5000
        extract:
          conversationId: $.conversation.id
        expect:
          status: 201
      - id: send
        continueOnFail: true
        request:
          method: POST
          url: ${baseUrl}/api/chat/send-stream
          json:
            conversation_id: ${conversationId}
            content: 回访 ordinary-reply：你好🌍
          timeoutMs: 5000
        expect:
          status: 200
          contains:
            - |
              event: user_message
            - |
              event: content
            - |
              event: done
            - '{"delta":"回访 ordinary-reply：你好🌍"}'
          notContains:
            - |
              event: error
            - 这段是归档连接上的后续记录
      - id: history
        request:
          method: GET
          url: ${baseUrl}/api/conversations/${conversationId}/messages
          timeoutMs: 5000
        expect:
          status: 200
          json:
            messages:
              - role: user
                content: 回访 ordinary-reply：你好🌍
                status: completed
              - role: assistant
                content: 收到：回访 ordinary-reply：你好🌍。祝你今天顺利🌍！
                reasoning_content: 正在整理资料。
                status: completed
