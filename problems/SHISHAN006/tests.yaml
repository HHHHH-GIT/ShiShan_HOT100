  - id: alternate-input
    type: workflow
    name: 不同输入与特殊字符保真
    displayName: 会话核验 15
    description: 核对本次回答、思考内容和历史记录。
    steps:
      - id: reset
        request:
          method: POST
          url: ${baseUrl}/api/chat/reset
          timeoutMs: 5000
        expect:
          status: 200
          json:
            status: ok
      - id: create
        request:
          method: POST
          url: ${baseUrl}/api/conversations
          json:
            sampleId: R002
          timeoutMs: 5000
        extract:
          conversationId: $.conversation.id
        expect:
          status: 201
      - id: send
        continueOnFail: true
        request:
          method: POST
          url: ${baseUrl}/api/chat/send-stream
          json:
            conversation_id: ${conversationId}
            content: |2-
                引号" / 反斜杠\ / 换行
              第二行🌍  
          timeoutMs: 5000
        expect:
          status: 200
          contains:
            - |
              event: user_message
            - |
              event: content
            - |
              event: done
            - '{"delta":"  引号\" / 反斜杠\\ / 换行\n第二行🌍  "}'
          notContains:
            - |
              event: error
            - 这段是归档连接上的后续记录
      - id: history
        request:
          method: GET
          url: ${baseUrl}/api/conversations/${conversationId}/messages
          timeoutMs: 5000
        expect:
          status: 200
          json:
            messages:
              - role: user
