  - id: message-update-redelivery
    type: workflow
    name: 可变投递键导致更新后重复入箱
    displayName: 消息更新后的收信检查
    description: 确认和撤回只更新原气泡；重复更新不应新增收件箱实体。
    steps:
      - id: reset
        request:
          method: POST
          url: ${baseUrl}/api/chat/reset
        expect:
          status: 200
          json:
            code: 0
      - id: first
        request:
          method: POST
          url: ${baseUrl}/api/chat/send
          headers: *a1
          json:
            conversationId: c_update
            senderId: u1
            clientMsgId: update-first
            content: before recall
        extract:
          updateId: $.data.msgId
        expect:
          status: 200
          json:
            code: 0
      - id: second
        request:
          method: POST
          url: ${baseUrl}/api/chat/send
          headers: *a1
          json:
            conversationId: c_update
            senderId: u1
            clientMsgId: update-second
            content: unrelated message
        expect:
          status: 200
          json:
            code: 0
      - id: ack
        request:
          method: POST
          url: ${baseUrl}/api/chat/ack
          headers: *a1
          json:
            conversationId: c_update
            msgId: ${updateId}
            userId: u2
        expect:
          status: 200
          json:
            code: 0
            data:
              acked: true
      - id: recall
        request:
          method: POST
          url: ${baseUrl}/api/chat/recall
          headers: *a1
          json:
            conversationId: c_update
            msgId: ${updateId}
            operatorId: u1
        expect:
          status: 200
          json:
            code: 0
            data:
              recalled: true
      - id: recall-again
        request:
          method: POST
          url: ${baseUrl}/api/chat/recall
          headers: *a1
          json:
            conversationId: c_update
            msgId: ${updateId}
            operatorId: u1
        expect:
          status: 200
          json:
            code: 0
            data:
              recalled: true
      - id: check-delivery
        request:
          method: GET
          url: ${baseUrl}/api/chat/inbox?conversationId=c_update&userId=u2
          headers: *a1
        expect:
          status: 200
          json:
            code: 0
            data:
              count: 2
          contains:
            - "[消息已撤回]"
            - unrelated message
          notContains:
            - before recall
      - id: check-records
        request:
          method: GET
          url: ${baseUrl}/api/chat/history?conversationId=c_update&limit=100
          headers: *a1
        expect:
          status: 200
          json:
            code: 0
            data:
              total: 2
  - id: filtered-history-boundary
    type: workflow
    name: 会话筛选后不存在的游标导致整页重放
    displayName: 交错会话历史读取检查
    description: before 是数值边界，可来自全局收信进度；不要求对应记录属于当前会话。
    steps:
      - id: reset
        request:
          method: POST
          url: ${baseUrl}/api/chat/reset
        expect:
          status: 200
          json:
            code: 0
      - id: older
        request:
          method: POST
          url: ${baseUrl}/api/chat/send
          headers: *a1
          json:
            conversationId: c_boundary
            senderId: u1
            clientMsgId: boundary-old
            content: older record
        extract:
          olderId: $.data.msgId
        expect:
          status: 200
          json:
            code: 0
      - id: checkpoint
        request:
          method: POST
          url: ${baseUrl}/api/chat/send
          headers: *a1
          json:
            conversationId: c_other
            senderId: u1
            clientMsgId: boundary-other
            content: other conversation
        extract:
          checkpoint: $.data.msgId
        expect:
          status: 200
          json:
            code: 0
      - id: newer
        request:
          method: POST
          url: ${baseUrl}/api/chat/send
          headers: *a1
          json:
            conversationId: c_boundary
            senderId: u1
            clientMsgId: boundary-new
            content: newer record
        expect:
          status: 200
          json:
            code: 0
      - id: history-before
        request:
          method: GET
          url: ${baseUrl}/api/chat/history?conversationId=c_boundary&before=${checkpoint}&limit=10
          headers: *a1
        expect:
          status: 200
          json:
            code: 0
            data:
              total: 2
              hasMore: false
              messages:
                - msgId: ${olderId}
          contains:
            - older record
          notContains:
            - newer record
            - other conversation
