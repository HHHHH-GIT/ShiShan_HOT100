<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>张冠李戴 · 报告工作台</title>
<style>
:root{color-scheme:light;font:15px/1.65 system-ui;background:#f5f3ef;color:#302f2d}*{box-sizing:border-box}body{max-width:1160px;margin:40px auto;padding:0 24px}h1{font-size:32px;margin:0}h2{font-size:19px;margin:0 0 14px}small,.muted{color:#716c63}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}.grid{display:grid;grid-template-columns:330px 1fr;gap:22px}.card{background:white;border:1px solid #dedad3;border-radius:12px;padding:23px;margin-bottom:18px}label{display:block;margin:12px 0 5px}select,input,button{font:inherit;padding:9px 12px;border:1px solid #cbc5bb;border-radius:7px;background:white}select,input{width:100%}button{cursor:pointer;margin:8px 5px 0 0}button.primary{background:#655080;border-color:#655080;color:white}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f3ef;padding:15px;border-radius:6px;font-size:13px}#notice{min-height:28px;color:#775594}.job{border-top:1px solid #eee;padding:14px 0}.job strong{margin-right:12px}.metrics{display:flex;gap:24px;padding:12px 0}.metrics b{font-size:24px;display:block}.sample{border-top:1px solid #ddd;padding:10px 0}#report:empty:before{content:'提交任务后，在队列中选择“执行”生成报告。';color:#716c63}@media(max-width:750px){.grid{grid-template-columns:1fr}.top{display:block}}
</style>
<body><div class="top"><div><small>SHISHAN008 / 离线分析工作台</small><h1>张冠李戴</h1><div class="muted">本地账号 · 完整提交记录 · 报告队列</div></div><div><button id="reload">重新载入工作台</button><button id="reset">重置数据</button></div></div>
<div id="notice" role="status"></div><div class="grid"><aside><section class="card"><h2>当前窗口</h2><label for="slot">窗口名称</label><input id="slot" value="desk" maxlength="40"><label for="account">登录账号</label><select id="account"><option value="">游客</option></select><button id="login" class="primary">应用登录身份</button><div id="session" class="muted">新窗口默认为游客</div></section>
<section class="card"><h2>新建报告</h2><label for="target">报告对象</label><select id="target"></select><label for="view">展示方式</label><select id="view"><option value="source">完整正文</option><option value="summary">摘要卡片</option></select><label for="languages">语言范围</label><select id="languages"><option value="all">全部</option><option value="python">Python</option><option value="java">Java</option><option value="javascript">JavaScript</option><option value="none">不选任何语言</option></select><button id="submit" class="primary">加入队列</button><p class="muted">任务按提交时的登录身份生成。摘要不展示源码；查看他人时只展示公开资料。</p></section></aside>
<main><section class="card"><h2>任务队列与历史</h2><button id="refresh">刷新列表</button><div id="jobs"></div></section><section class="card"><h2>报告预览</h2><div id="report"></div></section></main></div>
<script>
const $=id=>document.getElementById(id);
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);return data}
async function action(fn){try{$('notice').textContent='';await fn()}catch(e){$('notice').textContent=e.message}}
async function loadSession(){const s=await api('/api/session?slot='+encodeURIComponent($('slot').value));$('account').value=s.account??'';$('session').textContent=`${s.slot}：${s.account??'游客'}`}
$('slot').onchange=()=>action(loadSession);
function show(job){const r=job.report;if(!r)return;$('report').innerHTML=`<b>${escapeText(r.target)}</b> · 提交人 ${escapeText(job.viewer??'游客')} · ${r.status==='ready'?'已生成':'仅公开资料'}<div class="metrics"><div><b>${r.profile.solved}</b>已解题</div><div><b>${r.sampleCount}</b>代码样本</div><div><b>${r.metrics.totalLines}</b>非空代码行</div></div><div class="muted">${escapeText(JSON.stringify(r.metrics.languageDistribution))}</div>`+r.samples.map(s=>`<div class="sample"><b>${escapeText(s.title)}</b> · ${escapeText(s.language)} · ${escapeText(s.owner)}${r.view==='source'?`<pre>${escapeText(s.content.code??'')}</pre>`:'<p class="muted">摘要视图不展示源码</p>'}</div>`).join('')}
async function refresh(){const data=await api('/api/history');$('jobs').replaceChildren();for(const j of [...data.jobs].reverse()){const row=document.createElement('div');row.className='job';row.innerHTML=`<strong>${escapeText(j.jobId)}</strong>${escapeText(j.target)} · ${escapeText(j.viewer??'游客')} · ${j.status==='queued'?'待执行':'已完成'} `;const b=document.createElement('button');b.textContent=j.status==='queued'?'执行':'查看';b.onclick=()=>action(async()=>{const result=j.status==='queued'?await api('/api/jobs/'+j.jobId+'/run',{}):await api('/api/jobs/'+j.jobId);show(result);await refresh()});row.append(b);$('jobs').append(row)}}
$('login').onclick=()=>action(async()=>{const s=await api('/api/session',{slot:$('slot').value,account:$('account').value||null});$('session').textContent=`${s.slot}：${s.account??'游客'}`});
$('submit').onclick=()=>action(async()=>{const lang=$('languages').value;const j=await api('/api/reports',{slot:$('slot').value,target:$('target').value,view:$('view').value,languages:lang==='all'?null:lang==='none'?[]:[lang]});$('notice').textContent=`${j.jobId} 已排队`;await refresh()});
$('reload').onclick=()=>action(async()=>{await api('/api/reload',{});await refresh();$('notice').textContent='工作台已重新载入'});
$('reset').onclick=()=>action(async()=>{await api('/api/reset',{});$('report').replaceChildren();await loadSession();await refresh()});
$('refresh').onclick=()=>action(refresh);
action(async()=>{const d=await api('/api/catalog');for(const a of d.accounts){for(const id of ['account','target']){const o=document.createElement('option');o.value=a.account;o.textContent=`${a.account} · ${a.submissionCount} 条提交`;$(id).append(o)}}await loadSession();await refresh()});
</script></body></html>
