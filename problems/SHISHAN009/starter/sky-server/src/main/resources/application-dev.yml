# dev profile uses embedded H2 configured in application.yml
sky:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:sky_take_out;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password: ''
  alioss:
    endpoint: mock
    access-key-id: mock_key
    access-key-secret: mock_secret
    bucket-name: mock_bucket
  wechat:
    appid: mock_appid
    secret: mock_secret